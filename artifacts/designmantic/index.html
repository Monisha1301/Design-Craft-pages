<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>DesignMantic</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      var redirect = sessionStorage.getItem('spaRedirect');
      if (redirect) {
        sessionStorage.removeItem('spaRedirect');
        window.history.replaceState(null, '', redirect);
      }
    })();
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
  // Adds artificial delay to real website interactions for Selenium wait synchronization
  document.addEventListener('click', function(e) {
    // Intercept clicks on links, buttons, or inputs
    const target = e.target.closest('button, a, input[type="submit"]');
    if (!target || target.dataset.delayed) return;

    // Show a loading cursor and delay the actual action by 3 seconds
    e.preventDefault();
    e.stopImmediatePropagation();
    document.body.style.cursor = 'wait';
    target.style.opacity = '0.5';

    setTimeout(() => {
      document.body.style.cursor = 'default';
      target.style.opacity = '1';
      target.dataset.delayed = 'true';
      target.click(); // resume normal action after wait
      delete target.dataset.delayed;
    }, 3000); // 3-second delay
  }, true);
</script>
  </body>
</html>
